<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyttesFX.ai — Live Signals</title>
  <script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0e1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background-color: #0d1226;
      border-bottom: 1px solid #1e2a45;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00c896;
    }
    .logo span { color: #ffffff; }
    nav a {
      color: #aaaaaa;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    nav a:hover { color: #00c896; }
    .page-title {
      text-align: center;
      padding: 40px 20px 20px;
    }
    .page-title h1 {
      font-size: 32px;
      color: #00c896;
    }
    .page-subtitle {
      text-align: center;
      font-size: 14px;
      color: #aaaaaa;
      margin-top: 8px;
    }
    .signals-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .signal-card {
      background-color: #0d1226;
      border: 1px solid #1e2a45;
      border-radius: 12px;
      padding: 20px;
    }
    .signal-card h3 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .price-live {
      font-size: 24px;
      font-weight: bold;
      color: #00c896;
      margin-bottom: 8px;
    }
    .price-change {
      font-size: 13px;
      margin-bottom: 10px;
    }
    .price-change.up { color: #00c896; }
    .price-change.down { color: #ff4d4d; }
    .signal-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .buy { background-color: #00c896; color: #000; }
    .sell { background-color: #ff4d4d; color: #fff; }
    .neutral { background-color: #444; color: #fff; }
    .signal-info {
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .signal-info b { color: #ffffff; }
    .chart-container {
      width: 100%;
      height: 300px;
      background: #000;
      border-radius: 8px;
      margin-top: 12px;
      position: relative;
      overflow: hidden;
      border: 1px solid #1e2a45;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 12px;
      margin-top: 40px;
    }
    .maintenance-page {
      display: none;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
    }
    .maintenance-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px;
    }
    .maintenance-icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .maintenance-title {
      font-size: 36px;
      color: #00c896;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0, 200, 150, 0.5);
    }
    .maintenance-message {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="maintenance-page" id="maintenancePage">
  <div class="maintenance-container">
    <div class="maintenance-icon">⚙️</div>
    <div class="maintenance-title">LYTTESFX.AI</div>
    <div class="maintenance-message">
      We apologize for the inconvenience.<br/>
      Site will be back soon.
    </div>
  </div>
</div>

<div id="normalPage">
<header>
  <div class="logo">Lyttes<span>FX.ai</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="signals.html">Signals</a>
    <a href="setups.html">Setups</a>
    <a href="crypto.html">Crypto</a>
  </nav>
</header>

<div class="page-title">
  <h1>📡 Live Signals</h1>
  <p class="page-subtitle">Real market data • Professional TradingView charts</p>
</div>

<div class="signals-grid" id="signals-container"></div>

<footer>
  &copy; 2025 LyttesFX.ai — Real Market Data. Real Signals.
</footer>
</div>

<script>
const pairs = [
  { name: "BTC/USDT", symbol: "BTCUSDT", id: "bitcoin" },
  { name: "BNB/USDT", symbol: "BNBUSDT", id: "binancecoin" },
  { name: "ADA/USDT", symbol: "ADAUSDT", id: "cardano" },
  { name: "SOL/USDT", symbol: "SOLUSDT", id: "solana" },
  { name: "XRP/USDT", symbol: "XRPUSDT", id: "ripple" },
  { name: "ETH/USDT", symbol: "ETHUSDT", id: "ethereum" }
];

let charts = {};
let series = {};
let priceHistory = {};
let prevPrices = {};
let rsiValues = {};

window.onload = function() {
  checkMaintenance();
  initCards();
  loadSignals();
  setInterval(loadSignals, 1000);
  setInterval(checkMaintenance, 2000);
};

function checkMaintenance() {
  const maintenanceMode = localStorage.getItem("lyttesfx_maintenance") === "true";
  const signalsMaintenance = localStorage.getItem("lyttesfx_signals_maintenance") === "true";
  
  if (maintenanceMode || signalsMaintenance) {
    document.getElementById("maintenancePage").style.display = "block";
    document.getElementById("normalPage").style.display = "none";
  } else {
    document.getElementById("maintenancePage").style.display = "none";
    document.getElementById("normalPage").style.display = "block";
  }
}

function initCards() {
  pairs.forEach(pair => {
    priceHistory[pair.symbol] = [];
    
    const signalCard = document.createElement("div");
    signalCard.className = "signal-card";
    signalCard.setAttribute("data-pair", pair.symbol);
    signalCard.innerHTML = `
      <h3>${pair.name}</h3>
      <div class="price-live" data-price>$0.00</div>
      <div class="price-change" data-change style="opacity:0;">+0.00%</div>
      <span class="signal-badge neutral" data-signal>—</span>
      <div class="signal-info" data-info>Loading...</div>
      <div class="chart-container" id="chart-${pair.symbol}"></div>
    `;
    document.getElementById("signals-container").appendChild(signalCard);

    // Initialize TradingView chart
    const chartContainer = document.getElementById(`chart-${pair.symbol}`);
    charts[pair.symbol] = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: '#000' }, textColor: '#aaa' },
      timeScale: { timeVisible: true },
      width: chartContainer.offsetWidth,
      height: 300
    });
    series[pair.symbol] = charts[pair.symbol].addCandlestickSeries();
  });
}

function calcRSI(prices) {
  if (prices.length < 2) return 50;
  let gains = 0, losses = 0;
  for (let i = Math.max(0, prices.length - 14); i < prices.length - 1; i++) {
    const diff = prices[i + 1] - prices[i];
    if (diff > 0) gains += diff;
    else losses += Math.abs(diff);
  }
  if (losses === 0) return 100;
  return 100 - (100 / (1 + gains / losses));
}

function getSignal(price, id) {
  if (!priceHistory[id]) priceHistory[id] = [];
  priceHistory[id].push(price);
  if (priceHistory[id].length > 20) priceHistory[id].shift();

  const rsi = calcRSI(priceHistory[id]);
  rsiValues[id] = rsi;
  
  const prev = prevPrices[id];
  const change = prev ? ((price - prev) / prev) * 100 : 0;

  if (rsi < 30 && change > -0.5) return "BUY";
  if (rsi > 70 && change < 0.5) return "SELL";
  return "NEUTRAL";
}

function formatPrice(price) {
  if (!price) return "—";
  return "$" + parseFloat(price).toFixed(2);
}

async function fetchRealPrices() {
  try {
    const ids = "bitcoin,binancecoin,cardano,solana,ripple,ethereum";
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
    const data = await res.json();
    return {
      BTCUSDT: data.bitcoin?.usd,
      BNBUSDT: data.binancecoin?.usd,
      ADAUSDT: data.cardano?.usd,
      SOLUSDT: data.solana?.usd,
      XRPUSDT: data.ripple?.usd,
      ETHUSDT: data.ethereum?.usd
    };
  } catch (e) {
    return {};
  }
}

async function loadSignals() {
  const prices = await fetchRealPrices();

  pairs.forEach(pair => {
    const price = prices[pair.symbol];
    const card = document.querySelector(`[data-pair="${pair.symbol}"]`);
    
    if (!card || !price) return;

    const prev = prevPrices[pair.symbol];
    const signal = getSignal(price, pair.symbol);
    const badgeClass = signal === "BUY" ? "buy" : signal === "SELL" ? "sell" : "neutral";
    
    const changePercent = prev ? (((price - prev) / prev) * 100).toFixed(2) : "0.00";
    const changeClass = changePercent > 0 ? "up" : changePercent < 0 ? "down" : "up";
    const changeSign = changePercent > 0 ? "+" : "";

    card.querySelector("[data-price]").textContent = formatPrice(price);
    card.querySelector("[data-change]").textContent = changeSign + changePercent + "%";
    card.querySelector("[data-change]").className = "price-change " + changeClass;
    card.querySelector("[data-change]").style.opacity = "1";
    
    const signalBadge = card.querySelector("[data-signal]");
    signalBadge.textContent = signal;
    signalBadge.className = "signal-badge " + badgeClass;
    
    card.querySelector("[data-info]").innerHTML = `
      <b>RSI:</b> ${rsiValues[pair.symbol] ? rsiValues[pair.symbol].toFixed(1) : "—"} | <b>Signal:</b> ${signal}
    `;

    // Update chart
    const time = Math.floor(Date.now() / 1000);
    series[pair.symbol].update({
      time: time,
      open: price * 0.999,
      high: price * 1.001,
      low: price * 0.998,
      close: price
    });

    prevPrices[pair.symbol] = price;
  });
}
</script>

</body>
</html>
