<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyttesFX.ai — Live Signals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0e1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background-color: #0d1226;
      border-bottom: 1px solid #1e2a45;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00c896;
    }
    .logo span { color: #ffffff; }
    nav a {
      color: #aaaaaa;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    nav a:hover { color: #00c896; }
    .page-title {
      text-align: center;
      padding: 40px 20px 20px;
    }
    .page-title h1 {
      font-size: 32px;
      color: #00c896;
    }
    .page-subtitle {
      text-align: center;
      font-size: 14px;
      color: #aaaaaa;
      margin-top: 8px;
    }
    .signals-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .signal-card {
      background-color: #0d1226;
      border: 1px solid #1e2a45;
      border-radius: 12px;
      padding: 20px;
    }
    .signal-card h3 {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .price-live {
      font-size: 24px;
      font-weight: bold;
      color: #00c896;
      margin-bottom: 8px;
    }
    .price-change {
      font-size: 13px;
      margin-bottom: 10px;
    }
    .price-change.up { color: #00c896; }
    .price-change.down { color: #ff4d4d; }
    .signal-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .buy { background-color: #00c896; color: #000; }
    .sell { background-color: #ff4d4d; color: #fff; }
    .neutral { background-color: #444; color: #fff; }
    .signal-info {
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .signal-info b { color: #ffffff; }
    .chart-container {
      width: 100%;
      height: 300px;
      background: linear-gradient(to bottom, #0a0e1a, #000);
      border-radius: 8px;
      margin-top: 12px;
      position: relative;
      overflow: hidden;
      border: 1px solid #1e2a45;
    }
    .chart-canvas {
      width: 100%;
      height: 100%;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 12px;
      margin-top: 40px;
    }
    .maintenance-page {
      display: none;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
    }
    .maintenance-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px;
    }
    .maintenance-icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .maintenance-title {
      font-size: 32px;
      color: #00c896;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .maintenance-message {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="maintenance-page" id="maintenancePage">
  <div class="maintenance-container">
    <div class="maintenance-icon">⚙️</div>
    <div class="maintenance-title">Under Maintenance</div>
    <div class="maintenance-message">
      We apologize for this inconvenience.<br/>
      Site is currently under maintenance.
    </div>
  </div>
</div>

<div id="normalPage">
<header>
  <div class="logo">Lyttes<span>FX.ai</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="signals.html">Signals</a>
    <a href="setups.html">Setups</a>
  </nav>
</header>

<div class="page-title">
  <h1>📡 Live Signals & Candlesticks</h1>
  <p class="page-subtitle">Real candlestick charts updating every 1 second</p>
</div>

<div class="signals-grid" id="signals-container"></div>

<footer>
  &copy; 2025 LyttesFX.ai — Real Market Data. Real Signals.
</footer>
</div>

<script>
const pairs = [
  { name: "BNB/USDT", id: "binancecoin" },
  { name: "ADA/USDT", id: "cardano" },
  { name: "SOL/USDT", id: "solana" },
  { name: "XRP/USDT", id: "ripple" },
  { name: "ETH/USDT", id: "ethereum" }
];

let priceHistory = {};
let candleData = {};
let prevPrices = {};

window.onload = function() {
  checkMaintenance();
  initCards();
  loadSignals();
  setInterval(loadSignals, 1000);
  setInterval(checkMaintenance, 2000);
};

function checkMaintenance() {
  const maintenanceMode = localStorage.getItem("lyttesfx_maintenance") === "true";
  const maintenancePage = document.getElementById("maintenancePage");
  const normalPage = document.getElementById("normalPage");

  if (maintenanceMode) {
    maintenancePage.style.display = "block";
    normalPage.style.display = "none";
  } else {
    maintenancePage.style.display = "none";
    normalPage.style.display = "block";
  }
}

function initCards() {
  pairs.forEach(pair => {
    priceHistory[pair.id] = [];
    candleData[pair.id] = [];
    
    const signalCard = document.createElement("div");
    signalCard.className = "signal-card";
    signalCard.setAttribute("data-pair", pair.id);
    signalCard.innerHTML = `
      <h3>${pair.name}</h3>
      <div class="price-live" data-price>Loading...</div>
      <div class="price-change" data-change style="opacity:0;">+0.00%</div>
      <span class="signal-badge neutral" data-signal>—</span>
      <div class="signal-info" data-info>Loading...</div>
      <div class="chart-container">
        <canvas class="chart-canvas" data-chart="${pair.id}"></canvas>
      </div>
    `;
    document.getElementById("signals-container").appendChild(signalCard);
  });
}

function drawCandlesticks(pairId, candles) {
  const canvas = document.querySelector(`[data-chart="${pairId}"]`);
  if (!canvas || candles.length < 2) return;

  const ctx = canvas.getContext("2d");
  const width = canvas.offsetWidth;
  const height = canvas.offsetHeight;

  ctx.fillStyle = "#0a0e1a";
  ctx.fillRect(0, 0, width, height);

  const minPrice = Math.min(...candles.map(c => c.low));
  const maxPrice = Math.max(...candles.map(c => c.high));
  const range = maxPrice - minPrice || 1;

  const candleWidth = Math.max(8, (width - 40) / candles.length);
  const spacing = (width - 40) / candles.length;

  candles.forEach((candle, i) => {
    const x = 20 + i * spacing + spacing / 2;
    const highY = height - 20 - ((candle.high - minPrice) / range) * (height - 40);
    const lowY = height - 20 - ((candle.low - minPrice) / range) * (height - 40);
    const openY = height - 20 - ((candle.open - minPrice) / range) * (height - 40);
    const closeY = height - 20 - ((candle.close - minPrice) / range) * (height - 40);

    // Wick
    ctx.strokeStyle = candle.close >= candle.open ? "#00c896" : "#ff4d4d";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, highY);
    ctx.lineTo(x, lowY);
    ctx.stroke();

    // Body
    ctx.fillStyle = candle.close >= candle.open ? "#00c896" : "#ff4d4d";
    ctx.fillRect(x - candleWidth / 2, Math.min(openY, closeY), candleWidth, Math.abs(closeY - openY) || 1);
  });
}

function calcRSI(prices) {
  if (prices.length < 2) return 50;
  let gains = 0, losses = 0;
  for (let i = Math.max(0, prices.length - 14); i < prices.length - 1; i++) {
    const diff = prices[i + 1] - prices[i];
    if (diff > 0) gains += diff;
    else losses += Math.abs(diff);
  }
  if (losses === 0) return 100;
  return 100 - (100 / (1 + gains / losses));
}

function getSignal(price, id) {
  if (!priceHistory[id]) priceHistory[id] = [];
  priceHistory[id].push(price);
  if (priceHistory[id].length > 20) priceHistory[id].shift();

  const rsi = calcRSI(priceHistory[id]);
  const prev = prevPrices[id];
  const change = prev ? ((price - prev) / prev) * 100 : 0;

  if (rsi < 30 && change > -0.5) return { signal: "BUY", rsi };
  if (rsi > 70 && change < 0.5) return { signal: "SELL", rsi };
  return { signal: "NEUTRAL", rsi };
}

function formatPrice(price) {
  if (!price) return "—";
  return "$" + parseFloat(price).toFixed(2);
}

async function fetchCryptoPrices() {
  try {
    const ids = "binancecoin,cardano,solana,ripple,ethereum";
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
    const data = await res.json();
    return {
      binancecoin: data.binancecoin?.usd,
      cardano: data.cardano?.usd,
      solana: data.solana?.usd,
      ripple: data.ripple?.usd,
      ethereum: data.ethereum?.usd
    };
  } catch (e) {
    return {};
  }
}

async function loadSignals() {
  const crypto = await fetchCryptoPrices();

  pairs.forEach(pair => {
    const price = crypto[pair.id];
    const card = document.querySelector(`[data-pair="${pair.id}"]`);
    
    if (!card || !price) return;

    const prev = prevPrices[pair.id];
    const result = getSignal(price, pair.id);
    const badgeClass = result.signal === "BUY" ? "buy" : result.signal === "SELL" ? "sell" : "neutral";
    
    const changePercent = prev ? (((price - prev) / prev) * 100).toFixed(2) : "0.00";
    const changeClass = changePercent > 0 ? "up" : changePercent < 0 ? "down" : "up";
    const changeSign = changePercent > 0 ? "+" : "";

    card.querySelector("[data-price]").textContent = formatPrice(price);
    card.querySelector("[data-change]").textContent = changeSign + changePercent + "%";
    card.querySelector("[data-change]").className = "price-change " + changeClass;
    card.querySelector("[data-change]").style.opacity = "1";
    
    const signalBadge = card.querySelector("[data-signal]");
    signalBadge.textContent = result.signal;
    signalBadge.className = "signal-badge " + badgeClass;
    
    card.querySelector("[data-info]").innerHTML = `
      <b>RSI:</b> ${result.rsi.toFixed(1)} | <b>Time:</b> Real-time | <b>Source:</b> Live Data
    `;

    // Create candlestick
    if (!candleData[pair.id]) candleData[pair.id] = [];
    const lastCandle = candleData[pair.id][candleData[pair.id].length - 1];
    
    if (!lastCandle || Date.now() - lastCandle.time > 5000) {
      candleData[pair.id].push({
        open: price,
        high: price,
        low: price,
        close: price,
        time: Date.now()
      });
    } else {
      lastCandle.high = Math.max(lastCandle.high, price);
      lastCandle.low = Math.min(lastCandle.low, price);
      lastCandle.close = price;
    }

    if (candleData[pair.id].length > 40) candleData[pair.id].shift();

    drawCandlesticks(pair.id, candleData[pair.id]);

    prevPrices[pair.id] = price;
  });
}
</script>

</body>
</html>
