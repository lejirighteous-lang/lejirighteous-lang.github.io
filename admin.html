<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyttesFX.ai — Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0e1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background-color: #0d1226;
      border-bottom: 1px solid #1e2a45;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00c896;
    }
    .logo span { color: #ffffff; }
    .btn-logout {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-logout:hover { background-color: #cc0000; }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-title h1 {
      font-size: 32px;
      color: #00c896;
      margin-bottom: 10px;
    }
    .page-subtitle {
      color: #aaaaaa;
      font-size: 14px;
    }
    .section {
      background-color: #0d1226;
      border: 1px solid #1e2a45;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }
    .section h2 {
      font-size: 20px;
      color: #00c896;
      margin-bottom: 20px;
      border-bottom: 1px solid #1e2a45;
      padding-bottom: 10px;
    }
    .control-group {
      margin-bottom: 25px;
    }
    .control-label {
      color: #aaaaaa;
      font-size: 14px;
      margin-bottom: 10px;
      display: block;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: 0.4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00c896;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status-text {
      color: #aaaaaa;
      font-size: 13px;
    }
    .status-text.active {
      color: #00c896;
      font-weight: bold;
    }
    .timer-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .timer-btn {
      padding: 10px;
      background-color: #0a0e1a;
      border: 1px solid #1e2a45;
      color: #aaaaaa;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }
    .timer-btn:hover {
      border-color: #00c896;
      color: #00c896;
    }
    .timer-btn.active {
      background-color: #00c896;
      color: #000;
      border-color: #00c896;
    }
    .timer-display {
      margin-top: 15px;
      padding: 15px;
      background-color: #0a0e1a;
      border-radius: 6px;
      text-align: center;
      color: #00c896;
      font-weight: bold;
    }
    .users-section {
      margin-top: 20px;
    }
    .users-list {
      background-color: #0a0e1a;
      border-radius: 6px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
    }
    .user-item {
      padding: 10px;
      border-bottom: 1px solid #1e2a45;
      font-size: 13px;
      color: #aaaaaa;
    }
    .user-item:last-child {
      border-bottom: none;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Lyttes<span>FX.ai</span></div>
  <button class="btn-logout" onclick="handleLogout()">Logout</button>
</header>

<div class="container">
  <div class="page-title">
    <h1>⚙️ Admin Control Panel</h1>
    <p class="page-subtitle">Manage site maintenance and system settings</p>
  </div>

  <!-- SITE MAINTENANCE -->
  <div class="section">
    <h2>🌐 Site Maintenance</h2>
    <div class="control-group">
      <label class="control-label">Enable Site Maintenance (blocks everything)</label>
      <div class="toggle-switch">
        <label class="switch">
          <input type="checkbox" id="site-maintenance" onchange="toggleSiteMaintenance()">
          <span class="slider"></span>
        </label>
        <span class="status-text" id="site-status">Off</span>
      </div>
    </div>
    <div id="site-timer" style="display: none;">
      <label class="control-label">Set Timer:</label>
      <div class="timer-group">
        <button class="timer-btn" onclick="setSiteTimer(30)">30 min</button>
        <button class="timer-btn" onclick="setSiteTimer(60)">1 hour</button>
        <button class="timer-btn" onclick="setSiteTimer(120)">2 hours</button>
        <button class="timer-btn" onclick="setSiteTimer(300)">5 hours</button>
        <button class="timer-btn" onclick="setSiteTimer(1440)">24 hours</button>
      </div>
      <div class="timer-display" id="site-timer-display">Timer: Off</div>
    </div>
  </div>

  <!-- SIGNALS MAINTENANCE -->
  <div class="section">
    <h2>📡 Signals Page Maintenance</h2>
    <div class="control-group">
      <label class="control-label">Enable Signals Maintenance (only signals page)</label>
      <div class="toggle-switch">
        <label class="switch">
          <input type="checkbox" id="signals-maintenance" onchange="toggleSignalsMaintenance()">
          <span class="slider"></span>
        </label>
        <span class="status-text" id="signals-status">Off</span>
      </div>
    </div>
    <div id="signals-timer" style="display: none;">
      <label class="control-label">Set Timer:</label>
      <div class="timer-group">
        <button class="timer-btn" onclick="setSignalsTimer(30)">30 min</button>
        <button class="timer-btn" onclick="setSignalsTimer(60)">1 hour</button>
        <button class="timer-btn" onclick="setSignalsTimer(120)">2 hours</button>
        <button class="timer-btn" onclick="setSignalsTimer(300)">5 hours</button>
        <button class="timer-btn" onclick="setSignalsTimer(1440)">24 hours</button>
      </div>
      <div class="timer-display" id="signals-timer-display">Timer: Off</div>
    </div>
  </div>

  <!-- SETUPS MAINTENANCE -->
  <div class="section">
    <h2>📊 Setups Page Maintenance</h2>
    <div class="control-group">
      <label class="control-label">Enable Setups Maintenance (only setups page)</label>
      <div class="toggle-switch">
        <label class="switch">
          <input type="checkbox" id="setups-maintenance" onchange="toggleSetupsMaintenance()">
          <span class="slider"></span>
        </label>
        <span class="status-text" id="setups-status">Off</span>
      </div>
    </div>
    <div id="setups-timer" style="display: none;">
      <label class="control-label">Set Timer:</label>
      <div class="timer-group">
        <button class="timer-btn" onclick="setSetupsTimer(30)">30 min</button>
        <button class="timer-btn" onclick="setSetupsTimer(60)">1 hour</button>
        <button class="timer-btn" onclick="setSetupsTimer(120)">2 hours</button>
        <button class="timer-btn" onclick="setSetupsTimer(300)">5 hours</button>
        <button class="timer-btn" onclick="setSetupsTimer(1440)">24 hours</button>
      </div>
      <div class="timer-display" id="setups-timer-display">Timer: Off</div>
    </div>
  </div>

  <!-- USERS -->
  <div class="section">
    <h2>👥 Registered Users</h2>
    <div class="users-section">
      <div class="users-list" id="users-list">
        <p style="color: #aaaaaa; font-size: 13px;">Loading users...</p>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 LyttesFX.ai — Admin Panel
  </footer>
</div>

<script>
window.onload = function() {
  const admin = localStorage.getItem("lyttesfx_admin");
  if (!admin) {
    window.location.href = "admin-login.html";
    return;
  }
  
  loadAdminPanel();
  setInterval(updateTimers, 1000);
  loadUsers();
};

function loadAdminPanel() {
  const siteMaint = localStorage.getItem("lyttesfx_maintenance") === "true";
  const signalsMaint = localStorage.getItem("lyttesfx_signals_maintenance") === "true";
  const setupsMaint = localStorage.getItem("lyttesfx_setups_maintenance") === "true";

  document.getElementById("site-maintenance").checked = siteMaint;
  document.getElementById("signals-maintenance").checked = signalsMaint;
  document.getElementById("setups-maintenance").checked = setupsMaint;

  updateStatus();
}

function toggleSiteMaintenance() {
  const isChecked = document.getElementById("site-maintenance").checked;
  localStorage.setItem("lyttesfx_maintenance", isChecked ? "true" : "false");
  document.getElementById("site-timer").style.display = isChecked ? "block" : "none";
  if (!isChecked) {
    localStorage.removeItem("lyttesfx_site_maintenance_end");
  }
  updateStatus();
}

function toggleSignalsMaintenance() {
  const isChecked = document.getElementById("signals-maintenance").checked;
  localStorage.setItem("lyttesfx_signals_maintenance", isChecked ? "true" : "false");
  document.getElementById("signals-timer").style.display = isChecked ? "block" : "none";
  if (!isChecked) {
    localStorage.removeItem("lyttesfx_signals_maintenance_end");
  }
  updateStatus();
}

function toggleSetupsMaintenance() {
  const isChecked = document.getElementById("setups-maintenance").checked;
  localStorage.setItem("lyttesfx_setups_maintenance", isChecked ? "true" : "false");
  document.getElementById("setups-timer").style.display = isChecked ? "block" : "none";
  if (!isChecked) {
    localStorage.removeItem("lyttesfx_setups_maintenance_end");
  }
  updateStatus();
}

function setSiteTimer(minutes) {
  const endTime = Date.now() + minutes * 60 * 1000;
  localStorage.setItem("lyttesfx_site_maintenance_end", endTime);
  document.getElementById("site-maintenance").checked = true;
  localStorage.setItem("lyttesfx_maintenance", "true");
  document.getElementById("site-timer").style.display = "block";
  updateStatus();
}

function setSignalsTimer(minutes) {
  const endTime = Date.now() + minutes * 60 * 1000;
  localStorage.setItem("lyttesfx_signals_maintenance_end", endTime);
  document.getElementById("signals-maintenance").checked = true;
  localStorage.setItem("lyttesfx_signals_maintenance", "true");
  document.getElementById("signals-timer").style.display = "block";
  updateStatus();
}

function setSetupsTimer(minutes) {
  const endTime = Date.now() + minutes * 60 * 1000;
  localStorage.setItem("lyttesfx_setups_maintenance_end", endTime);
  document.getElementById("setups-maintenance").checked = true;
  localStorage.setItem("lyttesfx_setups_maintenance", "true");
  document.getElementById("setups-timer").style.display = "block";
  updateStatus();
}

function updateTimers() {
  const siteEnd = localStorage.getItem("lyttesfx_site_maintenance_end");
  const signalsEnd = localStorage.getItem("lyttesfx_signals_maintenance_end");
  const setupsEnd = localStorage.getItem("lyttesfx_setups_maintenance_end");

  if (siteEnd && Date.now() >= parseInt(siteEnd)) {
    localStorage.removeItem("lyttesfx_site_maintenance_end");
    localStorage.setItem("lyttesfx_maintenance", "false");
    document.getElementById("site-maintenance").checked = false;
    document.getElementById("site-timer").style.display = "none";
  }

  if (signalsEnd && Date.now() >= parseInt(signalsEnd)) {
    localStorage.removeItem("lyttesfx_signals_maintenance_end");
    localStorage.setItem("lyttesfx_signals_maintenance", "false");
    document.getElementById("signals-maintenance").checked = false;
    document.getElementById("signals-timer").style.display = "none";
  }

  if (setupsEnd && Date.now() >= parseInt(setupsEnd)) {
    localStorage.removeItem("lyttesfx_setups_maintenance_end");
    localStorage.setItem("lyttesfx_setups_maintenance", "false");
    document.getElementById("setups-maintenance").checked = false;
    document.getElementById("setups-timer").style.display = "none";
  }

  updateStatus();
}

function updateStatus() {
  const siteMaint = localStorage.getItem("lyttesfx_maintenance") === "true";
  const signalsMaint = localStorage.getItem("lyttesfx_signals_maintenance") === "true";
  const setupsMaint = localStorage.getItem("lyttesfx_setups_maintenance") === "true";

  document.getElementById("site-status").textContent = siteMaint ? "🔴 On" : "🟢 Off";
  document.getElementById("site-status").className = siteMaint ? "status-text active" : "status-text";
  document.getElementById("site-timer").style.display = siteMaint ? "block" : "none";

  document.getElementById("signals-status").textContent = signalsMaint ? "🔴 On" : "🟢 Off";
  document.getElementById("signals-status").className = signalsMaint ? "status-text active" : "status-text";
  document.getElementById("signals-timer").style.display = signalsMaint ? "block" : "none";

  document.getElementById("setups-status").textContent = setupsMaint ? "🔴 On" : "🟢 Off";
  document.getElementById("setups-status").className = setupsMaint ? "status-text active" : "status-text";
  document.getElementById("setups-timer").style.display = setupsMaint ? "block" : "none";

  updateTimerDisplay();
}

function updateTimerDisplay() {
  const siteEnd = localStorage.getItem("lyttesfx_site_maintenance_end");
  const signalsEnd = localStorage.getItem("lyttesfx_signals_maintenance_end");
  const setupsEnd = localStorage.getItem("lyttesfx_setups_maintenance_end");

  if (siteEnd) {
    const remaining = Math.max(0, parseInt(siteEnd) - Date.now());
    document.getElementById("site-timer-display").textContent = remaining > 0 ? `Ends in: ${formatTime(remaining)}` : "Timer: Off";
  }

  if (signalsEnd) {
    const remaining = Math.max(0, parseInt(signalsEnd) - Date.now());
    document.getElementById("signals-timer-display").textContent = remaining > 0 ? `Ends in: ${formatTime(remaining)}` : "Timer: Off";
  }

  if (setupsEnd) {
    const remaining = Math.max(0, parseInt(setupsEnd) - Date.now());
    document.getElementById("setups-timer-display").textContent = remaining > 0 ? `Ends in: ${formatTime(remaining)}` : "Timer: Off";
  }
}

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  
  if (hours > 0) return `${hours}h ${minutes}m`;
  if (minutes > 0) return `${minutes}m ${seconds}s`;
  return `${seconds}s`;
}

function loadUsers() {
  const users = JSON.parse(localStorage.getItem("lyttesfx_users") || "{}");
  const usersList = document.getElementById("users-list");
  
  if (Object.keys(users).length === 0) {
    usersList.innerHTML = '<p style="color: #aaaaaa; font-size: 13px;">No registered users yet</p>';
    return;
  }

  let html = '';
  for (const [username, data] of Object.entries(users)) {
    const createdAt = new Date(data.createdAt).toLocaleString();
    html += `<div class="user-item">👤 <strong>${username}</strong> • Joined: ${createdAt}</div>`;
  }
  usersList.innerHTML = html;
}

function handleLogout() {
  localStorage.removeItem("lyttesfx_admin");
  window.location.href = "admin-login.html";
}
</script>

</body>
</html>
