<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyttesFX.ai — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .maintenance-page {
      display: none;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
      width: 100%;
    }
    .maintenance-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px;
    }
    .maintenance-title {
      font-size: 36px;
      color: #00c896;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0, 200, 150, 0.5);
    }
    .maintenance-icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .maintenance-message {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.8;
    }
    .maintenance-status {
      font-size: 14px;
      color: #666;
      margin-top: 30px;
    }

    .login-container {
      background-color: #0d1226;
      border: 1px solid #1e2a45;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #00c896;
      margin-bottom: 30px;
    }
    .logo span { color: #ffffff; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #aaaaaa;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: #0a0e1a;
      border: 1px solid #1e2a45;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00c896;
    }
    .form-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #1e2a45;
    }
    .form-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      color: #aaaaaa;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: bold;
    }
    .form-tab.active {
      color: #00c896;
      border-bottom-color: #00c896;
    }
    .form-section {
      display: none;
    }
    .form-section.active {
      display: block;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #00c896;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-login:hover { background-color: #00a877; }
    .error {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="maintenance-page" id="maintenancePage">
  <div class="maintenance-container">
    <div class="maintenance-icon">⚙️</div>
    <div class="maintenance-title">LYTTESFX.AI</div>
    <div class="maintenance-message">
      We apologize for the inconvenience.<br/>
      Site will be back soon.
    </div>
    <div class="maintenance-status">
      Thank you for your patience!
    </div>
  </div>
</div>

<div id="loginContainer">
<div class="login-container">
  <div class="logo">Lyttes<span>FX.ai</span></div>
  
  <div class="form-tabs">
    <div class="form-tab active" onclick="switchTab('login')">Login</div>
    <div class="form-tab" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <!-- LOGIN FORM -->
  <div id="login-form" class="form-section active">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter password">
    </div>
    <button class="btn-login" onclick="handleLogin()">Login</button>
    <div class="error" id="login-error"></div>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signup-form" class="form-section">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="signup-username" placeholder="Choose username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="Create password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="signup-confirm" placeholder="Confirm password">
    </div>
    <button class="btn-login" onclick="handleSignup()">Sign Up</button>
    <div class="error" id="signup-error"></div>
  </div>
</div>
</div>

<script>
window.onload = function() {
  checkMaintenance();
  setInterval(checkMaintenance, 2000);
};

function checkMaintenance() {
  const maintenanceMode = localStorage.getItem("lyttesfx_maintenance") === "true";
  const maintenancePage = document.getElementById("maintenancePage");
  const loginContainer = document.getElementById("loginContainer");

  if (maintenanceMode) {
    maintenancePage.style.display = "block";
    loginContainer.style.display = "none";
  } else {
    maintenancePage.style.display = "none";
    loginContainer.style.display = "block";
  }
}

function switchTab(tab) {
  document.querySelectorAll(".form-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".form-section").forEach(s => s.classList.remove("active"));
  
  if (tab === "login") {
    document.querySelectorAll(".form-tab")[0].classList.add("active");
    document.getElementById("login-form").classList.add("active");
  } else {
    document.querySelectorAll(".form-tab")[1].classList.add("active");
    document.getElementById("signup-form").classList.add("active");
  }
}

function handleLogin() {
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();
  const errorEl = document.getElementById("login-error");

  if (!username || !password) {
    errorEl.textContent = "Username and password required";
    return;
  }

  const users = JSON.parse(localStorage.getItem("lyttesfx_users") || "{}");
  if (users[username] && users[username].password === password) {
    localStorage.setItem("lyttesfx_user", username);
    window.location.href = "dashboard.html";
  } else {
    errorEl.textContent = "Invalid username or password";
  }
}

function handleSignup() {
  const username = document.getElementById("signup-username").value.trim();
  const password = document.getElementById("signup-password").value.trim();
  const confirm = document.getElementById("signup-confirm").value.trim();
  const errorEl = document.getElementById("signup-error");

  if (!username || !password || !confirm) {
    errorEl.textContent = "All fields required";
    return;
  }

  if (password !== confirm) {
    errorEl.textContent = "Passwords do not match";
    return;
  }

  if (password.length < 6) {
    errorEl.textContent = "Password must be at least 6 characters";
    return;
  }

  const users = JSON.parse(localStorage.getItem("lyttesfx_users") || "{}");
  if (users[username]) {
    errorEl.textContent = "Username already exists";
    return;
  }

  users[username] = { password, createdAt: new Date().toISOString() };
  localStorage.setItem("lyttesfx_users", JSON.stringify(users));
  localStorage.setItem("lyttesfx_user", username);
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
