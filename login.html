<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyttesFX.ai — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background-color: #0d1226;
      border: 1px solid #1e2a45;
      border-radius: 15px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 200, 150, 0.1);
    }
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #00c896;
      margin-bottom: 30px;
    }
    .logo span { color: #ffffff; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaaaaa;
      font-size: 13px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #1e2a45;
      border-radius: 8px;
      background-color: #0a0e1a;
      color: #ffffff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #00c896;
      box-shadow: 0 0 10px rgba(0, 200, 150, 0.3);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-login {
      background-color: #00c896;
      color: #000;
    }
    .btn-login:hover {
      background-color: #00b080;
    }
    .btn-signup {
      background-color: #1e2a45;
      color: #00c896;
      border: 1px solid #00c896;
    }
    .btn-signup:hover {
      background-color: #2a3a55;
    }
    .error {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }
    .toggle-mode {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #aaaaaa;
    }
    .toggle-mode a {
      color: #00c896;
      text-decoration: none;
      cursor: pointer;
    }
    /* MAINTENANCE MODE STYLES */
    .maintenance-page {
      display: none;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1226 100%);
    }
    .maintenance-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px;
    }
    .maintenance-icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .maintenance-title {
      font-size: 32px;
      color: #00c896;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .maintenance-message {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .maintenance-status {
      font-size: 14px;
      color: #666;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<!-- MAINTENANCE PAGE -->
<div class="maintenance-page" id="maintenancePage">
  <div class="maintenance-container">
    <div class="maintenance-icon">⚙️</div>
    <div class="maintenance-title">Under Maintenance</div>
    <div class="maintenance-message">
      We apologize for this inconvenience.<br/>
      Site is currently under maintenance.
    </div>
    <div class="maintenance-status">
      We'll be back online shortly. Thank you for your patience!
    </div>
  </div>
</div>

<!-- LOGIN PAGE -->
<div class="login-container" id="loginContainer">
  <div class="logo">Lyttes<span>FX.ai</span></div>
  
  <div id="loginForm">
    <h2 style="text-align:center; font-size:20px; margin-bottom:30px; color:#fff;">Sign In</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Enter username">
      <div class="error" id="loginError"></div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password">
    </div>
    <div class="btn-group">
      <button class="btn-login" onclick="handleLogin()">Sign In</button>
      <button class="btn-signup" onclick="toggleMode()">Sign Up</button>
    </div>
    <div class="toggle-mode">
      Don't have an account? <a onclick="toggleMode()">Create one</a>
    </div>
  </div>

  <div id="signupForm" style="display:none;">
    <h2 style="text-align:center; font-size:20px; margin-bottom:30px; color:#fff;">Create Account</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="signupUsername" placeholder="Choose username">
      <div class="error" id="signupError"></div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Create password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="signupConfirm" placeholder="Confirm password">
    </div>
    <div class="btn-group">
      <button class="btn-login" onclick="handleSignup()">Create Account</button>
      <button class="btn-signup" onclick="toggleMode()">Back to Login</button>
    </div>
    <div class="toggle-mode">
      Already have an account? <a onclick="toggleMode()">Sign in</a>
    </div>
  </div>
</div>

<script>
// CHECK MAINTENANCE MODE FIRST
window.onload = function() {
  checkMaintenance();
};

function checkMaintenance() {
  const maintenanceMode = localStorage.getItem("lyttesfx_maintenance") === "true";
  const maintenancePage = document.getElementById("maintenancePage");
  const loginContainer = document.getElementById("loginContainer");

  if (maintenanceMode) {
    maintenancePage.style.display = "block";
    loginContainer.style.display = "none";
  } else {
    maintenancePage.style.display = "none";
    loginContainer.style.display = "block";
  }
};

function toggleMode() {
  document.getElementById("loginForm").style.display = document.getElementById("loginForm").style.display === "none" ? "block" : "none";
  document.getElementById("signupForm").style.display = document.getElementById("signupForm").style.display === "none" ? "block" : "none";
}

function getAllUsers() {
  const users = localStorage.getItem("lyttesfx_users");
  return users ? JSON.parse(users) : {};
}

function saveUsers(users) {
  localStorage.setItem("lyttesfx_users", JSON.stringify(users));
}

function handleLogin() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");

  if (!username || !password) {
    errorEl.textContent = "Username and password required";
    errorEl.style.display = "block";
    return;
  }

  if (username === "admin" && password === "Righteous$&@2010") {
    localStorage.setItem("lyttesfx_user", "admin");
    window.location.href = "admin.html";
    return;
  }

  const users = getAllUsers();
  if (users[username] && users[username].password === password) {
    localStorage.setItem("lyttesfx_user", username);
    window.location.href = "dashboard.html";
  } else {
    errorEl.textContent = "Invalid username or password";
    errorEl.style.display = "block";
  }
}

function handleSignup() {
  const username = document.getElementById("signupUsername").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById("signupConfirm").value;
  const errorEl = document.getElementById("signupError");

  if (!username || !password || !confirm) {
    errorEl.textContent = "All fields required";
    errorEl.style.display = "block";
    return;
  }

  if (password !== confirm) {
    errorEl.textContent = "Passwords don't match";
    errorEl.style.display = "block";
    return;
  }

  if (password.length < 6) {
    errorEl.textContent = "Password must be at least 6 characters";
    errorEl.style.display = "block";
    return;
  }

  const users = getAllUsers();
  if (users[username]) {
    errorEl.textContent = "Username already exists";
    errorEl.style.display = "block";
    return;
  }

  users[username] = { password: password, createdAt: new Date().toISOString() };
  saveUsers(users);

  errorEl.style.display = "none";
  localStorage.setItem("lyttesfx_user", username);
  window.location.href = "dashboard.html";
}

// Check maintenance mode every 5 seconds in case it's toggled
setInterval(checkMaintenance, 5000);
</script>

</body>
</html>
